<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<script src="assets/theme-init.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Sign in — according to</title>
<meta name="description" content="Sign in to your according to account to manage your Sources and Searches." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='2' y='2' width='96' height='96' rx='18' fill='%2316171B'/%3E%3Crect x='18' y='35' width='64' height='30' rx='4' fill='%23EFE47A'/%3E%3Ccircle cx='33' cy='50' r='7' fill='%2316171B'/%3E%3Ccircle cx='50' cy='50' r='7' fill='%2316171B'/%3E%3Ccircle cx='67' cy='50' r='7' fill='%2316171B'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #16171B;
    --paper: #F4F1EA;
    --white: #FFFFFF;
    --link: #1F3FA8;
    --link-hover: #16307E;
    --body-text: #57544C;
    --meta: #8A8578;
    --hairline: #E2DDD0;
    --hairline-soft: #EDE9DD;
    --contradicted: #C0392B;
    --sourced: #2F6B4F;
    --error-bg: #FBEAE7;
    --error-border: #E7C6BF;
    --ok-bg: #E9F3EC;
    --ok-border: #C7DECD;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #ECE8DD;
      --paper: #18191C;
      --white: #212226;
      --link: #7C93E8;
      --link-hover: #A9BEF2;
      --body-text: #B8B4A8;
      --meta: #9A968A;
      --hairline: #2E2F34;
      --hairline-soft: #26272B;
      --contradicted: #E2776A;
      --sourced: #5FBE8F;
      --error-bg: #2E1917;
      --error-border: #4A2A26;
      --ok-bg: #16261E;
      --ok-border: #244235;
    }
  }
  :root[data-theme="dark"] {
    --ink: #ECE8DD;
    --paper: #18191C;
    --white: #212226;
    --link: #7C93E8;
    --link-hover: #A9BEF2;
    --body-text: #B8B4A8;
    --meta: #9A968A;
    --hairline: #2E2F34;
    --hairline-soft: #26272B;
    --contradicted: #E2776A;
    --sourced: #5FBE8F;
    --error-bg: #2E1917;
    --error-border: #4A2A26;
    --ok-bg: #16261E;
    --ok-border: #244235;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.6;
  }
  a { color: var(--link); }
  a:hover { color: var(--link-hover); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }

  header.top { background: var(--white); padding: 20px 0; border-bottom: 1px solid var(--hairline-soft); }
  .top-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .theme-toggle {
    width: 34px; height: 34px; border-radius: 6px; border: 1px solid var(--hairline); background: var(--white);
    font-size: 15px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .theme-toggle:hover { background: var(--paper); }
  .mark { width: 34px; height: 34px; border-radius: 8px; background: var(--ink); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .mark svg { width: 22px; height: 22px; }
  .wordmark { font-family: 'Newsreader', serif; font-weight: 500; font-size: 19px; white-space: nowrap; }
  .tagline { font-family: 'Public Sans', sans-serif; font-size: 11px; font-weight: 500; color: var(--meta); margin-top: 1px; }

  main.auth { padding: 56px 0 64px; display: flex; justify-content: center; }
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--white);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 30px 28px;
  }
  .card h1 {
    font-family: 'Newsreader', serif;
    font-weight: 500;
    font-size: 24px;
    margin: 0 0 6px;
  }
  .card .sub { color: var(--body-text); font-size: 13.5px; margin: 0 0 22px; }

  .mode-switch { display: flex; gap: 4px; background: var(--paper); border: 1px solid var(--hairline); border-radius: 8px; padding: 3px; margin-bottom: 22px; }
  .mode-switch button {
    flex: 1; border: 0; background: transparent; padding: 8px 0; border-radius: 6px;
    font-family: inherit; font-weight: 700; font-size: 12.5px; color: var(--meta); cursor: pointer;
  }
  .mode-switch button.is-active { background: var(--ink); color: var(--paper); }

  label { display: block; font-size: 12.5px; font-weight: 600; margin: 14px 0 6px; }
  input[type="email"], input[type="password"], input[type="text"] {
    width: 100%; padding: 10px 12px; border: 1px solid var(--hairline); border-radius: 6px;
    font-family: inherit; font-size: 14px; background: var(--paper); color: var(--ink);
  }
  input:focus { outline: 2px solid var(--ink); outline-offset: 1px; }

  .btn { display: block; width: 100%; margin-top: 20px; padding: 11px 0; border-radius: 6px; border: none; font-weight: 700; font-size: 13.5px; cursor: pointer; }
  .btn-primary { background: var(--ink); color: var(--paper); }
  .btn-primary:disabled { opacity: 0.55; cursor: default; }
  .btn-link { background: none; border: none; color: var(--link); font-size: 12.5px; padding: 0; cursor: pointer; font-family: inherit; }

  .row-between { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }

  .msg { font-size: 13px; margin-top: 14px; border-radius: 6px; padding: 10px 12px; display: none; }
  .msg.is-error { display: block; background: var(--error-bg); color: var(--contradicted); border: 1px solid var(--error-border); }
  .msg.is-ok { display: block; background: var(--ok-bg); color: var(--sourced); border: 1px solid var(--ok-border); }

  footer { padding: 32px 0 48px; color: var(--meta); font-size: 13px; text-align: center; }
  footer a { color: var(--body-text); }
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-inner">
    <a class="brand" href="index.html" style="text-decoration:none; color:inherit;">
      <div class="mark">
        <svg viewBox="0 0 100 100"><rect x="18" y="35" width="64" height="30" rx="4" fill="#EFE47A"/><circle cx="33" cy="50" r="7" fill="#16171B"/><circle cx="50" cy="50" r="7" fill="#16171B"/><circle cx="67" cy="50" r="7" fill="#16171B"/></svg>
      </div>
      <div>
        <div class="wordmark">according to</div>
        <div class="tagline">evidence you can inspect</div>
      </div>
    </a>
    <button type="button" id="theme-toggle" class="theme-toggle"></button>
  </div>
</header>

<main class="auth">
  <div class="card">

    <div id="panel-credentials">
      <div class="mode-switch">
        <button type="button" id="tab-signin" class="is-active">Sign in</button>
        <button type="button" id="tab-signup">Create account</button>
      </div>

      <h1 id="cred-title">Welcome back</h1>
      <p class="sub" id="cred-sub">Sign in with the same account you use in the according to Chrome extension.</p>

      <form id="form-credentials">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required />
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required minlength="6" />
        <button type="submit" class="btn btn-primary" id="submit-credentials">Sign in</button>
      </form>

      <div class="row-between">
        <button type="button" class="btn-link" id="forgot-link">Forgot password?</button>
        <span></span>
      </div>

      <div class="msg" id="cred-msg"></div>
    </div>

    <div id="panel-reset-request" hidden>
      <h1>Reset your password</h1>
      <p class="sub">We'll email you a 6-digit code.</p>
      <form id="form-reset-request">
        <label for="reset-email">Email</label>
        <input id="reset-email" type="email" autocomplete="email" required />
        <button type="submit" class="btn btn-primary">Send reset code</button>
      </form>
      <div class="row-between">
        <button type="button" class="btn-link" id="back-to-signin-1">Back to sign in</button>
        <span></span>
      </div>
      <div class="msg" id="reset-request-msg"></div>
    </div>

    <div id="panel-reset-confirm" hidden>
      <h1>Enter your code</h1>
      <p class="sub">Check <span id="reset-target-email"></span> for a 6-digit code, and choose a new password.</p>
      <form id="form-reset-confirm">
        <label for="reset-code">6-digit code</label>
        <input id="reset-code" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" required />
        <label for="new-password">New password</label>
        <input id="new-password" type="password" autocomplete="new-password" required minlength="6" />
        <button type="submit" class="btn btn-primary">Set new password &amp; sign in</button>
      </form>
      <div class="row-between">
        <button type="button" class="btn-link" id="back-to-signin-2">Back to sign in</button>
        <span></span>
      </div>
      <div class="msg" id="reset-confirm-msg"></div>
    </div>

  </div>
</main>

<footer>
  <a href="index.html">according to</a> &nbsp;·&nbsp; <a href="privacy.html">Privacy</a>
</footer>

<script type="module">
  import { getSession, signIn, signUp, getRememberedEmail, requestPasswordReset, confirmPasswordReset } from "./assets/supabase.js";
  import { initThemeToggle } from "./assets/theme.js";

  initThemeToggle(document.getElementById("theme-toggle"));

  // Already signed in — no reason to show the login form.
  if (getSession()) {
    window.location.replace("app.html");
  }

  const params = new URLSearchParams(window.location.search);
  const redirectTo = params.get("next") && params.get("next").startsWith("/") ? params.get("next") : "app.html";

  const panels = {
    credentials: document.getElementById("panel-credentials"),
    resetRequest: document.getElementById("panel-reset-request"),
    resetConfirm: document.getElementById("panel-reset-confirm")
  };
  function showPanel(name) {
    for (const [key, el] of Object.entries(panels)) el.hidden = key !== name;
  }

  // ---------- Sign in / create account ----------

  let mode = "signin"; // or "signup"
  const tabSignin = document.getElementById("tab-signin");
  const tabSignup = document.getElementById("tab-signup");
  const credTitle = document.getElementById("cred-title");
  const credSub = document.getElementById("cred-sub");
  const submitBtn = document.getElementById("submit-credentials");
  const passwordInput = document.getElementById("password");
  const credMsg = document.getElementById("cred-msg");

  function setMode(next) {
    mode = next;
    tabSignin.classList.toggle("is-active", mode === "signin");
    tabSignup.classList.toggle("is-active", mode === "signup");
    credMsg.className = "msg";
    credMsg.textContent = "";
    if (mode === "signin") {
      credTitle.textContent = "Welcome back";
      credSub.textContent = "Sign in with the same account you use in the according to Chrome extension.";
      submitBtn.textContent = "Sign in";
      passwordInput.setAttribute("autocomplete", "current-password");
      passwordInput.removeAttribute("minlength");
    } else {
      credTitle.textContent = "Create your account";
      credSub.textContent = "One account works in both the Chrome extension and here.";
      submitBtn.textContent = "Create account";
      passwordInput.setAttribute("autocomplete", "new-password");
      passwordInput.setAttribute("minlength", "6");
    }
  }
  tabSignin.addEventListener("click", () => setMode("signin"));
  tabSignup.addEventListener("click", () => setMode("signup"));

  document.getElementById("email").value = getRememberedEmail();

  document.getElementById("form-credentials").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = passwordInput.value;
    submitBtn.disabled = true;
    credMsg.className = "msg";
    credMsg.textContent = "";
    try {
      if (mode === "signin") {
        await signIn(email, password);
        window.location.href = redirectTo;
      } else {
        const session = await signUp(email, password);
        if (session) {
          window.location.href = redirectTo;
        } else {
          credMsg.className = "msg is-ok";
          credMsg.textContent = "Account created — check your email to confirm it, then sign in.";
          setMode("signin");
          document.getElementById("email").value = email;
        }
      }
    } catch (err) {
      credMsg.className = "msg is-error";
      credMsg.textContent = err.message;
    } finally {
      submitBtn.disabled = false;
    }
  });

  // ---------- Forgot password ----------

  document.getElementById("forgot-link").addEventListener("click", () => {
    document.getElementById("reset-email").value = document.getElementById("email").value.trim();
    showPanel("resetRequest");
  });
  document.getElementById("back-to-signin-1").addEventListener("click", () => showPanel("credentials"));
  document.getElementById("back-to-signin-2").addEventListener("click", () => showPanel("credentials"));

  let resetEmail = "";
  document.getElementById("form-reset-request").addEventListener("submit", async (e) => {
    e.preventDefault();
    resetEmail = document.getElementById("reset-email").value.trim();
    const msg = document.getElementById("reset-request-msg");
    msg.className = "msg";
    try {
      await requestPasswordReset(resetEmail);
      document.getElementById("reset-target-email").textContent = resetEmail;
      showPanel("resetConfirm");
    } catch (err) {
      msg.className = "msg is-error";
      msg.textContent = err.message;
    }
  });

  document.getElementById("form-reset-confirm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const code = document.getElementById("reset-code").value.trim();
    const newPassword = document.getElementById("new-password").value;
    const msg = document.getElementById("reset-confirm-msg");
    msg.className = "msg";
    try {
      await confirmPasswordReset(resetEmail, code, newPassword);
      window.location.href = redirectTo;
    } catch (err) {
      msg.className = "msg is-error";
      msg.textContent = err.message;
    }
  });
</script>

</body>
</html>
